<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss: ws:; img-src 'self' data:; object-src 'none';">
<title>VijayamAI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Only the background panel fades with the opacity slider — text,
       icons and borders stay at fixed, fully-legible colors below, since
       previously the whole window (including text) faded together via
       Electron's native BrowserWindow.setOpacity(), making everything
       unreadable at low settings. --bg-alpha is set from JS. */
    --bg-alpha: 0.93;
    --bg: rgba(8, 10, 14, var(--bg-alpha));
    --border: rgba(255, 255, 255, 0.06);
    --border-bright: rgba(99, 255, 180, 0.3);
    --accent: #63ffb4;
    --accent2: #4f8cff;
    --text: #e8edf5;
    --text-dim: rgba(232, 237, 245, 0.45);
    --text-dimmer: rgba(232, 237, 245, 0.2);
    --danger: #ff5f72;
    --live: #ff5f72;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Arial', 'Helvetica Neue', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--sans);
    color: var(--text);
    user-select: none;
  }

  #app {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(99,255,180,0.08),
      0 32px 64px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* ── TITLEBAR ── */
  #titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: rgba(99,255,180,0.04);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .title-left { display: flex; align-items: center; gap: 8px; }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; box-shadow:0 0 8px var(--accent); }
    50%      { opacity:.5; box-shadow:0 0 3px var(--accent); }
  }
  .app-name {
    font-family: var(--sans); font-size: 12px; font-weight: 700;
    color: var(--accent); letter-spacing: .08em; text-transform: uppercase;
  }
  .stealth-badge {
    font-size: 9px; font-weight: 500; color: var(--text-dim);
    background: rgba(99,255,180,0.06); border: 1px solid rgba(99,255,180,0.15);
    border-radius: 4px; padding: 2px 6px; letter-spacing: .1em;
  }
  .title-actions { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
  .icon-btn {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  /* Minimize button */
  #minimize-btn { font-size: 14px; font-weight: 700; }
  #minimize-btn:hover { background: rgba(255,95,114,.15); color: var(--danger); border-color: rgba(255,95,114,.3); }
  #close-btn { font-size: 12px; font-weight: 700; }
  #close-btn:hover { background: rgba(255,95,114,.15); color: var(--danger); border-color: rgba(255,95,114,.3); }
  /* Opacity slider inline */
  .opacity-wrap {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0 6px; height: 24px; background: rgba(255,255,255,0.03);
  }
  .opacity-wrap span { font-size: 9px; color: var(--text-dimmer); user-select: none; }
  #opacity-slider {
    -webkit-appearance: none; appearance: none;
    width: 54px; height: 3px;
    background: rgba(255,255,255,0.12); border-radius: 2px; outline: none; cursor: pointer;
  }
  #opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 4px rgba(99,255,180,0.5);
  }
  #mic-btn.listening {
    border-color: rgba(255,95,114,.5); color: var(--live);
    background: rgba(255,95,114,.12);
    animation: micpulse 1.4s ease-in-out infinite;
  }
  @keyframes micpulse {
    0%,100% { box-shadow:0 0 0 0 rgba(255,95,114,.4); }
    50%      { box-shadow:0 0 0 4px rgba(255,95,114,0); }
  }
  .icon-btn.active {
    background: rgba(99,255,180,0.12);
    border-color: rgba(99,255,180,0.35); color: var(--accent);
  }
  .avatar-btn, .avatar-btn.active {
    border: none; border-radius: 50%;
    background: #E8963C; color: #fff;
    font-weight: 700; font-size: 11px;
  }
  .avatar-btn:hover, .avatar-btn.active:hover { background: #d6852c; color: #fff; }

  /* ── SETTINGS PANEL (API keys dropdown) ── */
  #settings-panel {
    position: absolute; top: 44px; right: 10px; z-index: 20;
    width: 260px; padding: 12px;
    background: #0d1117; border: 1px solid rgba(99,255,180,0.2);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    display: flex; flex-direction: column; gap: 10px;
  }
  .account-header {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border); text-align: center;
  }
  .settings-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #E8963C; color: #fff; font-weight: 700; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 2px;
  }
  .account-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .account-email { font-size: 9px; color: var(--text-dim); }
  .account-header .settings-ok-btn { align-self: stretch; margin-top: 4px; }
  .settings-row { display: flex; flex-direction: column; gap: 4px; }
  .settings-row label {
    font-size: 9px; color: var(--text-dimmer);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .settings-row input, .settings-row select {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--mono);
    font-size: 11px; padding: 6px 8px; outline: none;
  }
  .settings-row input:focus, .settings-row select:focus { border-color: rgba(99,255,180,0.3); }
  .settings-row select { cursor: pointer; }
  .settings-row select option { background: #0d1117; color: var(--text); }
  .settings-hint { font-size: 9px; color: var(--text-dimmer); line-height: 1.5; }
  .settings-ok-btn {
    align-self: flex-end;
    font-size: 10px; font-weight: 600; padding: 5px 14px;
    border-radius: 6px; border: 1px solid rgba(99,255,180,0.35);
    background: rgba(99,255,180,0.12); color: var(--accent);
    cursor: pointer; transition: all .15s;
  }
  .settings-ok-btn:hover { background: rgba(99,255,180,0.2); border-color: rgba(99,255,180,0.5); }

  /* ── VOICE BAR ── */
  #voice-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: rgba(0,0,0,0.08); min-height: 30px;
  }
  #voice-status {
    font-size: 9px; letter-spacing: .06em; color: var(--text-dimmer);
    text-transform: uppercase; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
  }
  #voice-status.live { color: var(--live); }
  #voice-status.speaking { color: var(--accent); }
  #voice-status.err { color: var(--danger); text-transform: none; letter-spacing: 0; }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 6px currentColor;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #live-transcript {
    flex: 1; font-size: 10px; color: var(--text-dim);
    font-style: italic; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .auto-toggle {
    display: flex; align-items: center; gap: 4px;
    font-size: 9px; color: var(--text-dim); cursor: pointer;
    white-space: nowrap; text-transform: uppercase; letter-spacing: .06em;
  }
  .auto-toggle input { accent-color: var(--accent); cursor: pointer; }

  /* ── VAD METER ── */
  #vad-meter {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden;
    flex-shrink: 0;
  }
  #vad-fill {
    height: 100%; width: 0%; border-radius: 2px;
    background: var(--accent); transition: width .05s, background .1s;
  }
  #vad-fill.hot { background: var(--live); }

  /* ── LOGIN SECTION (sits above the shortcut list in the empty state) ── */
  .login-section {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%; padding: 14px 16px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 8px;
  }
  .login-title {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent);
  }
  .login-sub { font-size: 9px; color: var(--text-dim); }
  .login-btn {
    width: 100%; font-family: var(--mono); font-size: 10px; font-weight: 600;
    padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(99,255,180,0.3);
    background: rgba(99,255,180,0.1); color: var(--accent);
    cursor: pointer; transition: all .15s;
  }
  .login-btn:hover { background: rgba(99,255,180,0.18); border-color: rgba(99,255,180,0.5); }
  .account-plan {
    font-size: 8px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); background: rgba(99,255,180,0.1);
    border: 1px solid rgba(99,255,180,0.3); border-radius: 10px; padding: 2px 8px;
  }
  .account-resume { font-size: 9px; color: var(--accent2); cursor: pointer; margin-top: 2px; }
  .account-resume:hover { text-decoration: underline; }
  .logout-btn {
    margin-top: 6px; border-color: var(--border);
    background: rgba(255,255,255,0.04); color: var(--text-dim);
  }
  .logout-btn:hover { background: rgba(255,95,114,0.12); border-color: rgba(255,95,114,0.3); color: var(--danger); }

  /* ── CONVERSATION ── */
  #conversation {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    /* Chromium auto-adjusts scroll position whenever content changes size
       anywhere in this container (CSS scroll anchoring) — during an
       answer's streaming + its final swap to rendered markdown, that
       fights and overrides the explicit scrollQuestionIntoTop() calls in
       App.js/voice.js, ending up pinned to the answer instead of the
       question. Disabling it hands scroll position entirely to our own JS. */
    overflow-anchor: none;
  }
  #conversation::-webkit-scrollbar { width: 3px; }
  #conversation::-webkit-scrollbar-track { background: transparent; }
  #conversation::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; opacity: .85; padding: 20px;
  }
  .empty-icon { font-size: 32px; filter: grayscale(1); opacity: .5; }
  .empty-text { font-size: 11px; color: var(--text-dim); text-align: center; line-height: 1.6; }
  .shortcuts { display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: 8px; }
  .shortcut-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 9px; background: rgba(255,255,255,0.05); border-radius: 5px;
  }
  .shortcut-key {
    font-size: 10px; color: var(--accent);
    background: rgba(99,255,180,0.12); border: 1px solid rgba(99,255,180,0.3);
    border-radius: 3px; padding: 2px 6px; font-weight: 600;
  }
  .shortcut-desc { font-size: 10px; color: var(--text); opacity: .8; }

  .message { display: flex; flex-direction: column; gap: 4px; animation: slideIn .2s ease-out; }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  /* Navigation highlight — flashes when jumping to a question */
  @keyframes navFlash {
    0%   { background: rgba(99,255,180,0.18); outline: 1px solid rgba(99,255,180,0.4); border-radius: 7px; }
    100% { background: transparent; outline: 1px solid transparent; }
  }
  .message.nav-focus { animation: navFlash 1.1s ease-out forwards; }
  .message-role { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .message.user      .message-role { color: var(--accent2); }
  .message.assistant .message-role { color: var(--accent); }
  .question-number {
    font-weight: 500;
    margin-right: 2px;
  }
  .message-content {
    font-size: 12.5px; line-height: 1.6; color: var(--text);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    white-space: pre-wrap; word-break: break-word; user-select: text;
  }
  .message.user      .message-content { border-color: rgba(79,140,255,0.15); background: rgba(79,140,255,0.05); color: var(--text-dim); }
  /* Question text itself — bright red so the asked question stands out
     clearly, even at a low background opacity, but otherwise the exact
     same size/weight as the answer text below it. */
  .message.user      .message-content.question-text { color: var(--danger); font-size: 12.5px; font-weight: 400; }
  .message.assistant .message-content { border-color: rgba(99,255,180,0.1); }
  .message.assistant .message-content.streaming::after {
    content: '▋'; color: var(--accent);
    animation: blink 1s step-start infinite; margin-left: 1px;
  }
  /* Inline code (function/variable names highlighted mid-sentence) matches
     the surrounding prose's font + size exactly (inherit) rather than
     switching to the monospace font used for actual multi-line code blocks
     below — mixing a monospace font into running sentences read as visually
     inconsistent/mismatched size even at the same px value. Dark backing so
     it still reads as "code", but light enough not to look like a bold
     chunky badge. */
  .message-content code {
    font-family: inherit; font-size: inherit; font-weight: inherit;
    background: rgba(0,0,0,0.25); border: none;
    border-radius: 3px; padding: 0 3px; color: #c3e88d;
  }
  .message-content pre {
    background: #0d1117; border: 1px solid rgba(255,255,255,0.07);
    border-left: 3px solid #c792ea;
    border-radius: 7px; padding: 12px 14px; margin: 7px 0;
    overflow-x: auto; font-size: 13px; line-height: 1.6;
    font-family: var(--mono); position: relative;
  }
  .message-content pre code {
    background: none; border: none; padding: 0;
    color: #e0e0e0; font-size: inherit; font-family: var(--mono);
  }
  /* ── SYNTAX TOKEN COLOURS (Material Night Owl) ── */
  .tk-kw   { color: #c792ea; font-weight: 600; }  /* keywords       purple  */
  .tk-type { color: #82aaff; }                     /* types/classes  blue    */
  .tk-fn   { color: #82aaff; }                     /* functions      blue    */
  .tk-str  { color: #c3e88d; }                     /* strings        green   */
  .tk-num  { color: #f78c6c; }                     /* numbers        orange  */
  .tk-cmt  { color: #546e7a; font-style: italic; } /* comments       gray    */
  .tk-cls  { color: #ffcb6b; }                     /* class names    yellow  */
  .tk-op   { color: #89ddff; }                     /* operators      cyan    */

  /* ── ASSISTANT MARKDOWN STYLES ── */
  .message.assistant .message-content {
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.7;
    color: #dde8f5;
  }
  /* Bold = accent green, medium weight — lets user scan key terms/buzzwords
     instantly via color, without the text looking heavy/shouty. */
  .message.assistant .message-content strong {
    color: #63ffb4;
    font-weight: 500;
  }
  /* Italic = soft yellow — for tips, notes, caveats */
  .message.assistant .message-content em {
    color: #ffd97d;
    font-style: normal;
    font-weight: 500;
  }
  /* Headers inside answers */
  .message.assistant .message-content h3,
  .message.assistant .message-content h4,
  .message.assistant .message-content h5 {
    color: #88c8ff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 10px 0 4px;
    padding-bottom: 3px;
    border-bottom: 1px solid rgba(136,200,255,0.2);
  }
  /* Lists */
  .message.assistant .message-content ul,
  .message.assistant .message-content ol {
    padding-left: 18px; margin: 4px 0;
  }
  .message.assistant .message-content li {
    margin: 3px 0; line-height: 1.6;
  }
  .message.assistant .message-content li::marker { color: #63ffb4; }
  /* Paragraphs */
  .message.assistant .message-content p {
    margin: 0 0 8px;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    font-size: 12.5px;
    line-height: 1.7;
    color: #dde8f5;
  }
  .message.assistant .message-content p:last-child { margin-bottom: 0; }

  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* ── INPUT AREA ── */
  #input-area {
    padding: 10px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0; background: rgba(0,0,0,0.2);
  }
  #prompt-input {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-family: var(--mono); font-size: 11px;
    color: var(--text); resize: none; outline: none;
    line-height: 1.5; transition: border-color .15s;
    min-height: 52px; max-height: 120px;
  }
  #prompt-input::placeholder { color: var(--text-dimmer); }
  #prompt-input:focus { border-color: rgba(99,255,180,0.3); background: rgba(255,255,255,0.06); }
  .input-footer { display: flex; align-items: center; justify-content: space-between; }
  .input-hint { font-size: 9px; color: var(--text-dimmer); }
  #send-btn {
    background: rgba(99,255,180,0.12); border: 1px solid rgba(99,255,180,0.3);
    border-radius: 7px; color: var(--accent); font-family: var(--mono);
    font-size: 11px; font-weight: 600; padding: 6px 16px;
    cursor: pointer; transition: all .15s; letter-spacing: .04em;
  }
  #send-btn:hover { background: rgba(99,255,180,0.2); box-shadow: 0 0 12px rgba(99,255,180,0.15); }
  #send-btn:active { transform: scale(.97); }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ── SCREENSHOT STRIP ── */
  #screenshot-strip {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-bottom: 2px;
  }
  #screenshot-strip:empty { display: none; }
  .sc-thumb {
    position: relative; width: 90px; height: 50px;
    border-radius: 5px; overflow: hidden;
    border: 1px solid rgba(99,255,180,0.35);
    cursor: default;
  }
  .sc-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sc-badge {
    position: absolute; bottom: 2px; left: 3px;
    font-size: 8px; background: rgba(0,0,0,0.65);
    color: var(--accent); border-radius: 3px; padding: 0 3px;
    font-family: var(--mono);
  }
  .sc-remove {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,0.75); color: #fff;
    border: none; border-radius: 50%;
    width: 13px; height: 13px; font-size: 9px;
    line-height: 13px; text-align: center;
    cursor: pointer; padding: 0;
  }
  .sc-remove:hover { background: rgba(220,60,60,0.85); }

  /* ── STATUS WARNING ── */
  #status-warning {
    padding: 8px 14px; background: rgba(255,95,114,0.08);
    border-bottom: 1px solid rgba(255,95,114,0.15);
    font-size: 10px; color: var(--danger);
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  #status-warning.hidden { display: none; }

  /* ── UPDATE BANNER ── */
  #update-banner {
    padding: 8px 14px; background: rgba(99,255,180,0.08);
    border-bottom: 1px solid rgba(99,255,180,0.2);
    font-size: 10px; color: var(--accent);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
  }
  #update-banner button {
    font-size: 9px; font-weight: 600; padding: 3px 10px;
    border-radius: 6px; border: 1px solid rgba(99,255,180,0.35);
    background: rgba(99,255,180,0.14); color: var(--accent);
    cursor: pointer; transition: all .15s;
  }
  #update-banner button:hover { background: rgba(99,255,180,0.25); border-color: rgba(99,255,180,0.55); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Electron's nodeIntegration renderer resolves require() paths relative to
  // the loaded HTML document, not the physical script file — that only works
  // correctly once inside a real require() chain. So the entry point is
  // require()'d from here (an inline script, whose __dirname == this file's
  // own directory) rather than loaded via <script src>, which runs as a
  // plain page script with no per-file module context of its own.
  require('./renderer/index.js');
</script>
</body>
</html>
